<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Schwarzes Brett · Turm Hotel Frankfurt</title>
<style>
:root{
  --ink:#2a2622;--cream:#f6f2ea;--cream-2:#efe8db;
  --brass:#a8854a;--brass-deep:#8a6a37;--line:#ddd2bf;--muted:#6f665b;--white:#fffdf8;
  --cork:#c9a876;--cork-dark:#b3905e;
  --pin-birthday:#e8c14f;--pin-ankuendigung:#7a9e8a;--pin-sonstiges:#c97a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);background:var(--cream);line-height:1.5;
}
header{
  background:var(--ink);color:var(--white);padding:1.8rem 1.5rem;text-align:center;
  border-bottom:3px solid var(--brass);
}
header .crown{font-size:1.6rem;color:var(--brass);display:block;margin-bottom:.3rem}
header h1{font-size:1.4rem;letter-spacing:.02em}
header p{color:var(--brass);font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;margin-top:.4rem}
main{max-width:56rem;margin:0 auto;padding:2rem 1.5rem 4rem}
.board{
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.04) 0, transparent 3%),
    radial-gradient(circle at 70% 60%, rgba(0,0,0,.04) 0, transparent 3%),
    radial-gradient(circle at 45% 85%, rgba(0,0,0,.04) 0, transparent 3%),
    linear-gradient(var(--cork), var(--cork));
  border:10px solid #7a5c3a;border-radius:6px;
  box-shadow:inset 0 0 30px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.2);
  padding:2rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1.4rem;
  min-height:16rem;
}
.note{
  background:var(--white);padding:1.2rem 1.2rem 1.4rem;
  box-shadow:0 4px 10px rgba(0,0,0,.25);position:relative;
  font-size:.92rem;
}
.note:nth-child(3n+1){transform:rotate(-2deg)}
.note:nth-child(3n+2){transform:rotate(1.5deg)}
.note:nth-child(3n){transform:rotate(-1deg)}
.note:hover{transform:rotate(0deg) scale(1.02);transition:transform .15s;z-index:2}
.pin{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;
  box-shadow:0 2px 3px rgba(0,0,0,.4);
}
.note.geburtstag .pin{background:var(--pin-birthday)}
.note.ankuendigung .pin{background:var(--pin-ankuendigung)}
.note.sonstiges .pin{background:var(--pin-sonstiges)}
.note .icon{font-size:1.4rem;margin-bottom:.4rem}
.note .titel{font-weight:700;margin-bottom:.4rem;line-height:1.3}
.note .text{color:#4a453e;font-size:.88rem}
.note .meta{margin-top:.7rem;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.empty{
  grid-column:1/-1;text-align:center;color:#6b5f45;padding:2.5rem 1rem;
}
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.8rem}
footer a{color:var(--brass-deep)}
</style>
</head>
<body>

<header>
  <span class="crown">♔</span>
  <h1>Schwarzes Brett</h1>
  <p>Turm Hotel Frankfurt · Für das Team</p>
</header>

<main>
  <div class="board" id="board">
    <div class="empty">Lade …</div>
  </div>
</main>

<footer>
  <a href="content/brett-editor.html">Beitrag hinzufügen/bearbeiten →</a><br>
  Zurück zur <a href="manager.html">Manager Platform</a>
</footer>

<script>
var ICONS = { geburtstag: '🎂', ankuendigung: '📢', sonstiges: '📌' };

function esc(s){ var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

function formatDatum(iso){
  if (!iso) return '';
  try {
    var p = iso.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  } catch(e) { return iso; }
}

function render(posts){
  var board = document.getElementById('board');
  if (!posts.length) {
    board.innerHTML = '<div class="empty">Aktuell hängt hier nichts — <a href="content/brett-editor.html">jetzt etwas anpinnen →</a></div>';
    return;
  }
  var sorted = posts.slice().sort(function(a, b){ return (b.datum || '').localeCompare(a.datum || ''); });
  board.innerHTML = '';
  sorted.forEach(function(p){
    var typ = ['geburtstag', 'ankuendigung', 'sonstiges'].indexOf(p.typ) !== -1 ? p.typ : 'sonstiges';
    var el = document.createElement('div');
    el.className = 'note ' + typ;
    el.innerHTML =
      '<div class="pin"></div>' +
      '<div class="icon">' + (ICONS[typ] || '📌') + '</div>' +
      '<div class="titel">' + esc(p.titel) + '</div>' +
      '<div class="text">' + esc(p.text) + '</div>' +
      '<div class="meta">' + formatDatum(p.datum) + (p.autor ? ' · ' + esc(p.autor) : '') + '</div>';
    board.appendChild(el);
  });
}

fetch('content/schwarzes-brett.json')
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(data){ render(data.posts || []); })
  .catch(function(e){
    console.error('Schwarzes Brett konnte nicht geladen werden', e);
    document.getElementById('board').innerHTML = '<div class="empty">Konnte nicht geladen werden.</div>';
  });
</script>
</body>
</html>
